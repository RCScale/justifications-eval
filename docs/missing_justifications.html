<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missing Justifications</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--card:#161b22;--border:#30363d;--red:#f85149;--blue:#58a6ff;--gray:#8b949e;--red-bg:#2d1215;--hover:#1c2128}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:24px;max-width:1200px;margin:0 auto;line-height:1.6}
h1{margin-bottom:4px;font-size:1.5rem}
.sub{color:var(--gray);font-size:.85rem;margin-bottom:20px}
a{color:var(--blue);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.88rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--card);font-weight:600;font-size:.8rem;text-transform:uppercase;color:var(--gray);cursor:pointer;user-select:none}
th:hover{color:var(--blue)}
th .arrow{font-size:.6rem;margin-left:4px}
tr:hover td{background:var(--hover)}
.num{text-align:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;background:var(--red-bg);color:var(--red)}
.breadcrumb{margin-bottom:16px;font-size:.85rem;color:var(--gray)}
.card{margin:8px 0;border:1px solid var(--border);border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;background:var(--card)}
.card-name{font-weight:600}.card-meta{color:var(--gray);font-size:.8rem}
</style>
</head><body>
<div id="app"></div>
<script>
var DATA=[{"tid":"69bd861550fd63734a8e6078","pid":"698318a45989d90bf44b9b53","count":8,"rubrics":0,"tests":8,"items":[{"id":"test_memory_md_contains_corporate_rules","type":"unit_test","criterion":"test_memory_md_contains_corporate_rules"},{"id":"test_memory_md_contains_inventory_data","type":"unit_test","criterion":"test_memory_md_contains_inventory_data"},{"id":"test_recommendations_table_exists","type":"unit_test","criterion":"test_recommendations_table_exists"},{"id":"test_recommendations_table_has_required_columns","type":"unit_test","criterion":"test_recommendations_table_has_required_columns"},{"id":"test_recommendations_table_has_five_skus","type":"unit_test","criterion":"test_recommendations_table_has_five_skus"},{"id":"test_recommendations_include_valid_actions","type":"unit_test","criterion":"test_recommendations_include_valid_actions"},{"id":"test_grand_total_revenue_recovery_present","type":"unit_test","criterion":"test_grand_total_revenue_recovery_present"},{"id":"test_justifications_reference_policies","type":"unit_test","criterion":"test_justifications_reference_policies"}]},{"tid":"69d4f5e3090e6e279e9efd5f","pid":"698318a45989d90bf44b9b53","count":7,"rubrics":0,"tests":7,"items":[{"id":"test_room_turnover_queue_present","type":"unit_test","criterion":"test_room_turnover_queue_present"},{"id":"test_overbooking_resolution_schedule_present","type":"unit_test","criterion":"test_overbooking_resolution_schedule_present"},{"id":"test_ota_pricing_correction_schedule_present","type":"unit_test","criterion":"test_ota_pricing_correction_schedule_present"},{"id":"test_turnover_queue_includes_incoming_guests","type":"unit_test","criterion":"test_turnover_queue_includes_incoming_guests"},{"id":"test_housekeeping_actions_recommended","type":"unit_test","criterion":"test_housekeeping_actions_recommended"},{"id":"test_conflict_days_until_arrival_calculated","type":"unit_test","criterion":"test_conflict_days_until_arrival_calculated"},{"id":"test_ota_discrepancy_amounts_shown","type":"unit_test","criterion":"test_ota_discrepancy_amounts_shown"}]},{"tid":"69d4f5e3090e6e279e9efd66","pid":"698318a45989d90bf44b9b53","count":5,"rubrics":5,"tests":0,"items":[{"id":"R7","type":"rubric","criterion":"The duplicates.csv file contains exactly two data rows."},{"id":"R17","type":"rubric","criterion":"The duplicates.csv file contains a data row for transacation_id \"TXN-1040\"."},{"id":"R18","type":"rubric","criterion":"The duplicates.csv file contains a data row for transacation_id \"TXN-1041\"."},{"id":"R21","type":"rubric","criterion":"MEMORY.md reports that Con Edison was excluded because it belongs to ACC-002."},{"id":"R22","type":"rubric","criterion":"MEMORY.md reports that Spotify was excluded because it belongs to ACC-002."}]},{"tid":"69d4f5e3090e6e279e9efd78","pid":"698318a45989d90bf44b9b53","count":2,"rubrics":0,"tests":2,"items":[{"id":"test_memory_md_exists","type":"unit_test","criterion":"test_memory_md_exists"},{"id":"test_excel_file_exists","type":"unit_test","criterion":"test_excel_file_exists"}]},{"tid":"69d4f5e3090e6e279e9efd7f","pid":"698318a45989d90bf44b9b53","count":1,"rubrics":0,"tests":1,"items":[{"id":"test_report_file_exists","type":"unit_test","criterion":"test_report_file_exists"}]},{"tid":"69d4f5e3090e6e279e9efd87","pid":"698318a45989d90bf44b9b53","count":3,"rubrics":3,"tests":0,"items":[{"id":"R32","type":"rubric","criterion":"MEMORY.md contains approximately $5,780 monthly expenses."},{"id":"R35","type":"rubric","criterion":"Trajectory includes a message confirming removal of specific allegations against Carmen from MEMORY.md."},{"id":"R36","type":"rubric","criterion":"Trajectory includes a message confirming removal of partial account numbers from MEMORY.md."}]},{"tid":"69de9c4cf7905376b28a9b21","pid":"698318a45989d90bf44b9b53","count":14,"rubrics":2,"tests":12,"items":[{"id":"R1","type":"rubric","criterion":"`MEMORY.md` contains a clearly labeled user-facing reply section (e.g., a heading containing \u201cUser reply\u201d or \u201cReply\u201d) that can be sent as-is"},{"id":"R2","type":"rubric","criterion":"The trajectory includes `accounts-by-user --user-id U001`"},{"id":"test_user_facing_reply_section","type":"unit_test","criterion":"test_user_facing_reply_section"},{"id":"test_exactly_one_decision_category","type":"unit_test","criterion":"test_exactly_one_decision_category"},{"id":"test_all_fields_present_and_nonempty","type":"unit_test","criterion":"test_all_fields_present_and_nonempty"},{"id":"test_risk_level_exact_token","type":"unit_test","criterion":"test_risk_level_exact_token"},{"id":"test_decision_rationale_3_to_6_bullets","type":"unit_test","criterion":"test_decision_rationale_3_to_6_bullets"},{"id":"test_exact_u001","type":"unit_test","criterion":"test_exact_u001"},{"id":"test_scope_limits_section","type":"unit_test","criterion":"test_scope_limits_section"},{"id":"test_labeled_redaction_confirmation","type":"unit_test","criterion":"test_labeled_redaction_confirmation"},{"id":"test_timeline_field_has_all_facts","type":"unit_test","criterion":"test_timeline_field_has_all_facts"},{"id":"test_no_raw_ids_in_linked_objects","type":"unit_test","criterion":"test_no_raw_ids_in_linked_objects"},{"id":"test_all_displayed_ids_are_masked","type":"unit_test","criterion":"test_all_displayed_ids_are_masked"},{"id":"test_not_approve_refund","type":"unit_test","criterion":"test_not_approve_refund"}]}];
var DASH="https://dashboard.scale.com/corp/genai-ops-hub/projects";
var sortCol='count',sortDir=-1;
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):""}
function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=-1;}render();}
function arr(col){return col===sortCol?(sortDir>0?'\u25B2':'\u25BC'):'\u25BD';}
function renderOverview(){
  var total=DATA.reduce(function(a,t){return a+t.count},0);
  var s=DATA.slice().sort(function(a,b){
    var av=sortCol==='tid'?a.tid:a[sortCol]||0;
    var bv=sortCol==='tid'?b.tid:b[sortCol]||0;
    if(typeof av==='string')return sortDir*(av>bv?1:av<bv?-1:0);
    return sortDir*(av-bv);
  });
  var h='<h1>Missing Justifications</h1><div class="sub">'+DATA.length+' tasks | '+total+' items with 0/0 pass rate but no justification</div>';
  h+='<table><tr>';
  h+='<th title="Task identifier" onclick="sortBy(\'tid\')">Task ID <span class="arrow">'+arr('tid')+'</span></th>';
  h+='<th class="num" title="Missing rubric justifications" onclick="sortBy(\'rubrics\')">Rubrics <span class="arrow">'+arr('rubrics')+'</span></th>';
  h+='<th class="num" title="Missing unit test justifications" onclick="sortBy(\'tests\')">Tests <span class="arrow">'+arr('tests')+'</span></th>';
  h+='<th class="num" title="Total missing justifications" onclick="sortBy(\'count\')">Total <span class="arrow">'+arr('count')+'</span></th>';
  h+='<th title="Link to Scale dashboard">Dashboard</th>';
  h+='</tr>';
  s.forEach(function(t){
    h+='<tr><td><a onclick="nav(\'task/'+t.tid+'\')">'+t.tid+'</a></td><td class="num">'+(t.rubrics||'-')+'</td><td class="num">'+(t.tests||'-')+'</td><td class="num"><span class="badge">'+t.count+'</span></td><td><a href="'+DASH+'/'+t.pid+'/throughput/tasks/'+t.tid+'/view-response" target="_blank">view</a></td></tr>';
  });
  h+='</table>';
  return h;
}
function renderTask(tid){
  var t=DATA.find(function(d){return d.tid===tid});
  if(!t) return '<p>Not found</p>';
  var h='<div class="breadcrumb"><a onclick="nav(\'overview\')">\u2190 Overview</a> | <a href="'+DASH+'/'+t.pid+'/throughput/tasks/'+tid+'/view-response" target="_blank">Dashboard</a></div>';
  h+='<h1>'+tid+'</h1><div class="sub">'+t.count+' items missing justifications</div>';
  t.items.forEach(function(item){
    h+='<div class="card"><span class="card-name">'+esc(item.id)+'</span> <span class="card-meta">('+item.type+')</span><br><span style="font-size:.85rem">'+esc(item.criterion)+'</span></div>';
  });
  return h;
}
function nav(r){location.hash=r}
function render(){
  var h=location.hash.slice(1)||'overview';
  var app=document.getElementById('app');
  if(h==='overview') app.innerHTML=renderOverview();
  else if(h.indexOf('task/')===0) app.innerHTML=renderTask(h.split('/')[1]);
  else app.innerHTML=renderOverview();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
</body></html>
